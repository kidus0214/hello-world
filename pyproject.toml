[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Turn long videos into captioned vertical clips and queue them for posting"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2",
    "yt-dlp>=2025.11.12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
