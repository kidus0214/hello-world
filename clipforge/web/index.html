<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f14; --panel: #161a22; --line: #262c38; --text: #e8ebf1; --dim: #8a93a6;
    --accent: #ff4fa3; --ok: #3ddc97; --warn: #ffb020; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 12px; }
  .sub { color: var(--dim); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  input[type=text], input[type=number], select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; font: inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1 1 130px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--text); font-size: 14px; }
  button { background: var(--accent); color: #14060d; border: 0; border-radius: 8px; padding: 10px 16px;
           font: inherit; font-weight: 650; cursor: pointer; margin-top: 14px; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--warn); }
  .job { border-top: 1px solid var(--line); padding: 16px 0; }
  .job:first-child { border-top: 0; padding-top: 0; }
  .job-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .job-title { font-weight: 600; overflow-wrap: anywhere; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  .pill.running, .pill.queued { color: var(--warn); border-color: var(--warn); }
  .pill.error { color: var(--bad); border-color: var(--bad); }
  .meta { color: var(--dim); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 12px; }
  .clip { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .clip video { width: 100%; aspect-ratio: 9 / 16; background: #000; display: block; }
  .clip .body { padding: 10px; font-size: 13px; }
  .clip .t { font-weight: 600; overflow-wrap: anywhere; }
  .clip .c { color: var(--dim); margin-top: 4px; overflow-wrap: anywhere; }
  .empty { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Clip<span>Forge</span></h1>
  <p class="sub">Paste a video link. Get captioned vertical clips, ready to post.</p>

  <div class="grid">
    <section class="panel">
      <h2>New clip job</h2>
      <label for="source">Video link or file path on this Mac</label>
      <input id="source" type="text" placeholder="https://www.youtube.com/watch?v=...">
      <div class="row">
        <div>
          <label for="rights">Your rights to this footage</label>
          <select id="rights">
            <option value="own">My own footage</option>
            <option value="licensed">I have permission</option>
            <option value="cc">Creative Commons</option>
            <option value="unverified" selected>Not confirmed</option>
          </select>
        </div>
        <div>
          <label for="count">Clips</label>
          <input id="count" type="number" min="1" max="10" value="3">
        </div>
        <div>
          <label for="layout">Framing</label>
          <select id="layout">
            <option value="blur">Whole frame on blur</option>
            <option value="crop">Crop to centre</option>
          </select>
        </div>
      </div>
      <label class="check"><input id="autopublish" type="checkbox"> Send to <span id="pubmode">outbox</span> when finished</label>
      <button id="go">Make clips</button>
      <div class="msg" id="jobmsg" role="status"></div>
    </section>

    <section class="panel">
      <h2>Timer</h2>
      <label class="check"><input id="sched-on" type="checkbox"> Clip the most viewed new video</label>
      <div class="row">
        <div>
          <label for="sched-hours">Every (hours)</label>
          <input id="sched-hours" type="number" min="0.5" max="168" step="0.5">
        </div>
      </div>
      <label for="sched-query">Search query (allowlisted channels are always checked)</label>
      <input id="sched-query" type="text">
      <div class="row">
        <button id="sched-save" class="ghost">Save timer</button>
        <button id="sched-now" class="ghost">Run now</button>
      </div>
      <div class="meta" id="sched-info"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Jobs</h2>
    <div id="jobs"><p class="empty">No jobs yet.</p></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

// Titles, captions and logs come from other people's videos, so they are only ever
// inserted as text nodes, never as HTML.
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "text") node.textContent = value;
    else if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child) node.append(child);
  return node;
}

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

let rendered = "";
let scheduleLoaded = false;

function renderJobs(jobs) {
  const signature = JSON.stringify(jobs.map((j) => [j.id, j.status, j.step, j.clips.map((c) => [c.file, (c.published || []).length])]));
  if (signature === rendered) return;   // do not rebuild (and restart videos) when nothing changed
  rendered = signature;
  const root = $("jobs");
  root.replaceChildren();
  if (!jobs.length) { root.append(el("p", { class: "empty", text: "No jobs yet." })); return; }
  for (const job of jobs) {
    const lastLog = job.log.length ? job.log[job.log.length - 1].msg.split("\n")[0] : "";
    const status = job.status === "running" ? `${job.status}: ${job.step}` : job.status;
    const box = el("div", { class: "job" }, [
      el("div", { class: "job-head" }, [
        el("span", { class: "job-title", text: job.meta.title || job.source }),
        el("span", { class: `pill ${job.status}`, text: status }),
        el("span", { class: "pill", text: `rights: ${job.rights}` }),
      ]),
      el("div", { class: "meta", text: job.error || (job.selector ? `Moments picked by ${job.selector}` : lastLog) }),
    ]);
    const ready = job.clips.filter((c) => c.file);
    if (ready.length) {
      const grid = el("div", { class: "clips" });
      for (const clip of ready) {
        const posts = (clip.published || []).filter((p) => !p.error && !p.skipped).length;
        grid.append(el("div", { class: "clip" }, [
          el("video", { controls: "", preload: "none", poster: `/media/${job.id}/${clip.thumb}`, src: `/media/${job.id}/${clip.file}` }),
          el("div", { class: "body" }, [
            el("div", { class: "t", text: clip.title }),
            el("div", { class: "c", text: `${Math.round(clip.end - clip.start)}s · score ${clip.score}${posts ? ` · sent (${posts})` : ""}` }),
            el("div", { class: "c", text: clip.caption }),
          ]),
        ]));
      }
      box.append(grid);
      if (job.status === "done") {
        const button = el("button", { class: "ghost", text: "Send all to publish queue" });
        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            const { results } = await api("/api/publish", { job: job.id });
            const failed = results.filter((r) => r.error).length;
            button.textContent = failed ? `Sent with ${failed} failures` : "Sent";
            rendered = "";
          } catch (error) { button.textContent = error.message; button.disabled = false; }
        });
        box.append(button);
      }
    }
    root.append(box);
  }
}

async function refresh() {
  try {
    const state = await api("/api/state");
    renderJobs(state.jobs);
    $("pubmode").textContent = state.publish.mode === "postiz" ? `Postiz (${state.publish.post_type})` : "outbox";
    const s = state.schedule;
    if (!scheduleLoaded) {
      $("sched-on").checked = s.enabled; $("sched-hours").value = s.every_hours; $("sched-query").value = s.query || "";
      scheduleLoaded = true;
    }
    const last = s.last_run ? new Date(s.last_run * 1000).toLocaleString() : "never";
    const sources = state.allowlist.length ? `${state.allowlist.length} allowlisted channel(s)` : "no allowlisted channels yet (add them in config.toml)";
    $("sched-info").textContent = `Last run: ${last}. ${s.last_result || ""} Sources: ${sources}.`;
  } catch (error) { /* server restarting; try again on the next tick */ }
}

$("go").addEventListener("click", async () => {
  $("jobmsg").textContent = "";
  try {
    await api("/api/jobs", {
      source: $("source").value, rights: $("rights").value, count: $("count").value,
      layout: $("layout").value, publish: $("autopublish").checked,
    });
    $("source").value = "";
    refresh();
  } catch (error) { $("jobmsg").textContent = error.message; }
});

$("sched-save").addEventListener("click", async () => {
  await api("/api/schedule", { enabled: $("sched-on").checked, every_hours: $("sched-hours").value, query: $("sched-query").value });
  refresh();
});
$("sched-now").addEventListener("click", async () => { await api("/api/auto", {}); refresh(); });

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
